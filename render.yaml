services:
  - type: web
    name: the-quad-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    # Uncomment to persist uploaded avatars across deploys/restarts (see README §5):
    # disk:
    #   name: quad-uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://the-quad-web.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "18317"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      # Avatar storage (optional but recommended for production — this free
      # plan has no persistent disk, so local-disk avatars are lost on every
      # deploy/restart). Point these at an S3-compatible bucket (Cloudflare
      # R2, Backblaze B2, etc). See backend/.env.example for details.
      # - key: S3_ENDPOINT
      #   sync: false
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false
      # - key: S3_PUBLIC_URL
      #   sync: false
      # Outgoing email (optional — password reset emails log to the console
      # until these are set). See backend/.env.example for details.
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false

  - type: web
    name: the-quad-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://the-quad-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
